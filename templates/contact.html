<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Gaming Universe</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<!-- ================= CUSTOM ALERT ================= -->
<div id="customAlert" class="alert-overlay">
  <div class="alert-box">
    <h3 id="alertTitle"></h3>
    <p id="alertMessage"></p>
    <button onclick="closeAlert()">OK</button>
  </div>
</div>

<header class="header">
  <div class="container">

    <a href="{{ url_for('home') }}" class="logo">
      <img src="{{ url_for('static', filename='images/website-logo.png') }}" alt="">
    </a>

    <nav class="navbar">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('latest_games') }}">Latest</a>
      <a href="{{ url_for('top_games') }}">Top Played</a>
      <a href="{{ url_for('about') }}">About</a>
      <a href="{{ url_for('contact') }}" class="active">Contact</a>
      <!-- 🔐 PROTECTED PLAY BUTTON -->
      <a href="javascript:void(0)" onclick="checkPlayAccess()">Play</a>
    </nav>

    <button class="login-btn" id="loginBtn" onclick="openLogin()">Login</button>
    <button class="login-btn" id="logoutBtn" onclick="logout()" style="display:none;">
      Logout
    </button>

  </div>
</header>


  <main class="container section">
    <h1 class="style-h1">Contact Us</h1>

    <div class="form" style="margin-top:18px;">
      <label for="name">Your name</label>
      <input id="name" type="text" placeholder="John Doe">

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com">

      <label for="message">Message</label>
      <textarea id="message" placeholder="Tell us what you need..."></textarea>

      <button class="style-btn" type="button">Send Message</button>
    </div>
  </main>

  <footer class="footer">
    <div class="container">Built with HTML & CSS • Gaming Universe</div>
  </footer>
  <div class="auth-overlay" id="signupPopup" style="display:none;">
    <span class="cross" onclick="closePopup()">✕</span>
    <div class="auth-box">
      <h2>Create Account</h2>
      <input type="text" id="firstName" placeholder="First Name">
      <input type="text" id="lastName" placeholder="Last Name">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <button type="button" onclick="signup()">Sign Up</button>
      <p onclick="switchToLogin()">Already have an account? Login</p>
    </div>
  </div>

  <!-- ================= LOGIN POPUP ================= -->
  <div class="auth-overlay" id="loginPopup" style="display:none;">
    <span class="cross" onclick="closePopup()">✕</span>
    <div class="auth-box">
      <h2>Login</h2>
      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Password">
      <button type="button" onclick="login()">Login</button>
      <p onclick="switchToSignup()">New User? Create Account</p>
    </div>
  </div>
</body>
<script src="{{ url_for('static', filename='script.js') }}"></script>

</html>
